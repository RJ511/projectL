<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#132238}.title{font:600 26px Georgia,serif}.sub{font-size:14px;fill:#58708f}.head{font-size:17px;font-weight:700}.label{font-size:13px;fill:#415873}.value{font-size:13px;font-weight:700}.formula{font:16px Cambria,Georgia,serif}.caption{font:italic 13px Georgia,serif;fill:#344b67}</style></defs>
  <rect width="1200" height="600" rx="18" fill="#fff"/><text x="55" y="50" fill="#1769aa" font-size="12" font-weight="800" letter-spacing="2">MODELO DE EVIDÊNCIA</text><text x="55" y="87" class="title">De um evento observável à atualização do conceito</text><text x="55" y="115" class="sub">Tentativa prática em Condicionais: 4/5 respostas corretas, confiança declarada de 75%.</text>
  <g><rect x="55" y="150" width="315" height="230" rx="14" fill="#fbfdff" stroke="#cad7e8"/><text x="78" y="182" class="head">Estado anterior</text><text x="78" y="222" class="label">Evidência favorável (α)</text><text x="345" y="222" text-anchor="end" class="value">2,5000</text><text x="78" y="260" class="label">Evidência de dificuldade (β)</text><text x="345" y="260" text-anchor="end" class="value">3,5000</text><text x="78" y="298" class="label">Domínio estimado</text><text x="345" y="298" text-anchor="end" class="value">41,67%</text><text x="78" y="336" class="label">Incerteza</text><text x="345" y="336" text-anchor="end" class="value">41,67%</text>
  <rect x="442" y="150" width="315" height="230" rx="14" fill="#eaf4ff" stroke="#91bde2"/><text x="465" y="182" class="head">Evento de aprendizagem</text><text x="465" y="218" class="label">Tipo</text><text x="732" y="218" text-anchor="end" class="value">Tentativa prática</text><text x="465" y="250" class="label">Resultado objetivo</text><text x="732" y="250" text-anchor="end" class="value">4 / 5</text><text x="465" y="282" class="label">Confiança declarada</text><text x="732" y="282" text-anchor="end" class="value">75%</text><text x="465" y="314" class="label">Score efetivo</text><text x="732" y="314" text-anchor="end" class="value">67,04%</text><text x="465" y="346" class="label">Peso aplicado</text><text x="732" y="346" text-anchor="end" class="value">9,47%</text>
  <rect x="829" y="150" width="315" height="230" rx="14" fill="#e7f7ee" stroke="#9fd0b5"/><text x="852" y="182" class="head">Estado atualizado</text><text x="852" y="222" class="label">Evidência favorável (α)</text><text x="1119" y="222" text-anchor="end" class="value">2,5635</text><text x="852" y="260" class="label">Evidência de dificuldade (β)</text><text x="1119" y="260" text-anchor="end" class="value">3,5312</text><text x="852" y="298" class="label">Domínio estimado</text><text x="1119" y="298" text-anchor="end" class="value">42,06%</text><text x="852" y="336" class="label">Incerteza</text><text x="1119" y="336" text-anchor="end" class="value">41,22%</text></g>
  <path d="M380 265h50" stroke="#1769aa" stroke-width="3"/><path d="M421 255l15 10-15 10" fill="none" stroke="#1769aa" stroke-width="3"/><path d="M767 265h50" stroke="#1769aa" stroke-width="3"/><path d="M808 255l15 10-15 10" fill="none" stroke="#1769aa" stroke-width="3"/>
  <rect x="55" y="410" width="1089" height="92" rx="10" fill="#f5f9fd"/><text x="80" y="446" class="formula">α′ = 2,5000 + (0,0947 × 0,6704) = 2,5635</text><text x="80" y="480" class="formula">β′ = 3,5000 + (0,0947 × (1 − 0,6704)) = 3,5312</text>
  <line x1="55" y1="535" x2="1144" y2="535" stroke="#cad7e8"/><text x="55" y="568" class="caption">Figura 6.1 — Transformação de um evento de aprendizagem em evidência conceptual e novo estado.</text>
</svg>
